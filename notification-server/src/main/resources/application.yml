server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: notification-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:notification_platform}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:notification}
    password: ${MYSQL_PASSWORD:notification123}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:notification123}
      timeout: 3s
  flyway:
    enabled: true
    baseline-on-migrate: true
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: notification-producer-group
    send-message-timeout: 3000
notification:
  mq:
    topic: notification-send-topic
  outbox:
    publish-interval-ms: 1000
    batch-size: 100
    # PROCESSING超过30秒认为实例可能已经死亡
    claim-timeout-seconds: 30
    # 当前退避最大 60 秒；20 次可覆盖分钟级 Broker 故障并自动恢复。
    # 永久失败最终仍进入 DEAD，不能无限重试。
    max-retry-count: 20
  observability:
    outbox:
      # 后台刷新数据库快照；Prometheus 抓取不直接执行 SQL。
      refresh-interval-ms: 5000
    bloom:
      # 独立探测 Bloom 信任状态，故障实验可在 15 秒内被观察。
      refresh-interval-ms: 15000
  shortlink:
    hot-cache:
      max-size: 10000
      ttl: 1m

    negative-cache:
      ttl: 2m
      jitter: 30s

    bloom:
      # 先以 10 万个仍有效短码做小规模可验证实验。
      expected-insertions: 100000
      # 这是查询全部保留片后的总体目标，不是每片目标。
      overall-false-positive-probability: 0.01
      # ISO-8601 Duration；生产默认每 6 小时轮换。
      slice-duration: PT6H
      # 当前片 + 3 个历史片，总窗口 24 小时。
      retained-slice-count: 4
      # 每分钟检查一次是否跨入新片或 ready 丢失。
      rebuild-check-interval-ms: 60000

    click:
      topic: short-link-click-topic
      send-timeout-ms: 1000
      visitor-salt: ${SHORT_LINK_VISITOR_SALT:local-development-salt}

    snowflake:
      # day16仅供实现bean使用，生产默认仍是随机base62
      # 多实例生产启用前必须实现可靠、互斥的nodeId分配
      node-id: ${SHORT_LINK_SNOWFLAKE_NODE_ID:1}
      # 5ms 与 50ms回拨实验均应被逻辑时间吸收，超过50ms明确失败
      max-backward-ms: 50
      # 同毫秒4096个序列耗尽之后，最多等待10ms
      sequence-wait-timeout-ms: 10

# 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        http.server.requests: true

      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n"
