server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: notification-worker

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:notification_platform}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:notification}
    password: ${MYSQL_PASSWORD:notification123}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      maximum-pool-size: 10
      minimum-idle: 2

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:notification123}
      timeout: 3s

  flyway:
    enabled: false

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}

notification:
  worker:
    # 实验时显式传 WORKER_INSTANCE_ID=worker-a / worker-b
    # 未传时使用随机 UUID，保证两个本地 JVM 不会重名。
    instance-id: ${WORKER_INSTANCE_ID:${random.uuid}}

  mq:
    topic: notification-send-topic
    consumer-group: notification-worker-group
    dlq-consumer-group: notification-worker-dlq-group

    broadcast-probe:
      # 默认关闭，避免普通开发启动额外 Consumer
      enabled: ${MQ_BROADCAST_PROBE_ENABLED:false}
      topic: notification-worker-probe-topic
      consumer-group: notification-worker-probe-broadcast-group

  send:
    max-attempts: 3

  retry:
    scan-interval-ms: 1000
    batch-size: 100

  rate-limit:
    capacity: 10
    refill-tokens-per-second: 5
    bucket-ttl: 10m
    decision-ttl: 1h
    fail-open: true
    daily-quota: 100000
    quota-zone-id: Asia/Shanghai

  channel-resilience:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 100
    keep-alive: 30s
    call-timeout: 2s
    failure-threshold: 3
    open-duration: 10s

  shortlink:
    click:
      topic: short-link-click-topic
      consumer-group: short-link-click-worker-group

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        http.server.requests: true
        notification.channel.call.duration: true
        notification.mq.consume.duration: true

      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
        notification.channel.call.duration: 50ms,100ms,200ms,500ms,1s,2s
        notification.mq.consume.duration: 50ms,100ms,500ms,1s,2s,5s,10s

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n"