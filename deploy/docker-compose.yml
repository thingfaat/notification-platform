name: notification-platform

services:
  mysql:
    image: mysql:8.0
    container_name: notification-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: notification_platform
      MYSQL_USER: notification
      MYSQL_PASSWORD: notification123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - notification-network

  redis:
    image: redis:7
    container_name: notification-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "notification123"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a notification123 ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - notification-network

  namesrv:
    image: apache/rocketmq:5.3.2
    container_name: notification-rmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    networks:
      - notification-network

  broker:
    image: apache/rocketmq:5.3.2
    container_name: notification-rmq-broker
    restart: unless-stopped
    depends_on:
      - namesrv
    environment:
      NAMESRV_ADDR: namesrv:9876
      HEAP_OPTS: >-
        -Xms512m
        -Xmx512m
        -Xmn256m
        -XX:MaxDirectMemorySize=512m
    command:
      - sh
      - mqbroker
      - -n
      - namesrv:9876
      - -c
      - /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
      - "5557:5557"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf
      - rocketmq-store:/home/rocketmq/store
    networks:
      - notification-network

  dashboard:
    image: apacherocketmq/rocketmq-dashboard:2.0.1
    container_name: notification-rmq-dashboard
    restart: unless-stopped
    depends_on:
      - namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"
    ports:
      - "6060:8080"
    networks:
      - notification-network

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: notification-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
      - broker
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - notification-network

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: notification-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    depends_on:
      - mailhog
    networks:
      - notification-network

  grafana:
    image: grafana/grafana:12.2.0
    container_name: notification-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: notification123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - notification-network

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: notification-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - notification-network

volumes:
  mysql-data:
  redis-data:
  rocketmq-store:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  notification-network:
    driver: bridge
